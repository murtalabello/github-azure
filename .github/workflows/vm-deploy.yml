# VM deployment pipeline
#   PR to main         -> plan dev + prod, plan posted as PR comment
#   push/merge to main -> plan+apply dev, then plan prod (prod is NOT applied automatically)
#   manual dispatch    -> plan / apply one environment (prod apply waits for approval)
# Tearing down lives in vm-destroy.yml.
name: vm-deploy

on:
  pull_request:
    branches: [main]
    paths:
      - infra/vm/**
      - modules/vm/**
      - .github/workflows/vm-deploy.yml
      - .github/workflows/terraform-vm-reusable.yml
  push:
    branches: [main]
    paths:
      - infra/vm/**
      - modules/vm/**
      - .github/workflows/vm-deploy.yml
      - .github/workflows/terraform-vm-reusable.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev
      action:
        description: Terraform action
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  pr-plan:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/terraform-vm-reusable.yml
    with:
      environment: ${{ matrix.environment }}
      action: plan

  dev:
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/terraform-vm-reusable.yml
    with:
      environment: dev
      action: apply

  prod:
    if: github.event_name == 'push'
    needs: dev
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/terraform-vm-reusable.yml
    with:
      environment: prod
      # Plan only: prod is applied by hand with "Run workflow" (environment=prod, action=apply).
      action: plan

  manual:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/terraform-vm-reusable.yml
    with:
      environment: ${{ inputs.environment }}
      action: ${{ inputs.action }}
